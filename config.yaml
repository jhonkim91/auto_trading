# ============================================================
#  자동매매 전략 / 리스크 설정
#  민감정보(앱키 등)는 .env 에, 전략 파라미터는 여기에 둡니다.
# ============================================================

# 감시할 종목 목록
universe:
  # 국내주식: 6자리 종목코드
  domestic:
    - "005930"   # 삼성전자
    - "000660"   # SK하이닉스
    - "035720"   # 카카오
  # 해외주식(미국): 심볼 + 거래소코드(NAS/NYS/AMS)
  overseas:
    - { symbol: "AAPL", exchange: "NAS" }
    - { symbol: "TSLA", exchange: "NAS" }

# 시장 전체 스크리너 (종목 자동 발굴)
# enabled: true 면 위 universe.domestic 고정목록 대신 거래량순위에서 후보를 뽑아
# 가격/모멘텀 필터 후 상위 top_k 종목만 전략 분석해 자동매매한다.
screener:
  enabled: true
  market: "all"        # all / kospi / kosdaq
  pool_size: 30        # 거래량 순위 후보 수
  top_k: 15            # 심층 분석(자동매매 대상) 상위 모멘텀 종목 수
  min_price: 2000      # 국내 동전주 제외(원)
  max_price: 500000    # 국내(원)
  momentum_rank: true  # 등락률 기준 모멘텀 정렬
  # 미국장(USD 기준) - 미국장 시간엔 미국 종목을 발굴
  overseas_market: "NAS"     # NAS / NYS / AMS
  overseas_min_price: 5      # USD
  overseas_max_price: 1000   # USD
  overseas_pool: ["AAPL","MSFT","NVDA","TSLA","AMZN","GOOGL","META","AMD","NFLX","AVGO","PLTR","COIN"]
  # true: 통합증거금(원화로 미국매수·자동환전) 기준 매수가능금액으로 수량 산정
  # false: USD 예수금만 사용(미리 환전한 달러로만 매수)
  overseas_use_buyable: true

# 매매 엔진
engine:
  loop_interval_sec: 60          # 시그널 점검 주기(초)
  process_timeout_sec: 30        # 종목 1개 처리 최대 대기시간(초), 초과 시 다음 종목으로 진행
  domestic_session: "09:00-15:20"  # 국내장 자동매매 시간
  overseas_session: "23:30-06:00"  # 미국장(한국시간, 서머타임 무시 단순값)
  auto_trade_enabled: true       # false 면 시그널 알림만 (반자동)

# 종합 시그널 전략 가중치 (점수 합산 방식)
# 각 지표가 매수/매도 점수를 내고, 임계치를 넘으면 주문
strategy:
  # 지표 최대 가중치 합: 매수 7(이평1+RSI1+MACD1+볼린저1+돌파2+신고가1), 매도 4
  buy_threshold: 3               # 매수: 변동성돌파(2) 단독 불가 → 2개 이상 지표 동의 필요
  sell_threshold: 2              # 매도: 빠른 청산 위해 2 유지 (손절/트레일링/익절은 별도)
  confirm_threshold: 1           # 1차 트리거 이후 보조 확인 최솟값
  indicators:
    ma_cross:    { enabled: true,  short: 5,  long: 20,  weight: 1 }
    rsi:         { enabled: true,  period: 14, low: 30, high: 70, weight: 1 }
    macd:        { enabled: true,  fast: 12, slow: 26, signal: 9, weight: 1 }
    bollinger:   { enabled: true,  period: 20, num_std: 2.0, weight: 1 }
    vol_breakout: { enabled: true, k: 0.5, weight: 2 }   # 래리 윌리엄스 변동성 돌파
    new_high:    { enabled: true,  period: 60, weight: 1 }              # N일 신고가 돌파
    adx:         { enabled: true,  period: 14, min: 20, penalty: 1 }    # 추세 강도 약하면 매수점수 차감
    regime:      { enabled: true,  ma: 60 }                             # 가격이 60일선 아래면 신규매수 보류(하락장 방지)

# 국내/해외 전략 파라미터 override
# 비워두면 위 strategy를 그대로 사용하고, 필요한 키만 적으면 strategy 기본값과 재귀 병합됩니다.
strategy_domestic: {}
strategy_overseas:
  # 예: 미국 대형주는 신호를 조금 더 보수적으로 운용
  buy_threshold: 4

# 리스크 관리
risk:
  max_positions: 5               # 동시 보유 최대 종목 수
  risk_per_trade_pct: 1.0        # 거래당 계좌대비 위험 비율(%) - ATR 기반 포지션 사이징
  stop_loss_pct: 5.0             # 손절 라인(%)
  take_profit_pct: 10.0          # 익절 라인(%)
  trailing_stop_pct: 4.0         # 트레일링 스탑(%): 보유 고점 대비 하락폭, 수익구간에서만 작동 (0이면 끔)
  cooldown_min: 30               # 청산 후 같은 종목 재매수 금지 시간(분), 0이면 끔
  daily_loss_limit_pct: 3.0      # 일일 손실 한도(%) 도달 시 당일 매매 중단
  max_drawdown_pct: 15.0         # 누적 MDD 한도(%) 도달 시 전체 청산 알림
  atr_period: 14

# 비용 파라미터 (2026년 기준, 변경 시 이 값을 수정)
costs:
  risk_free_rate: 0.025          # 무위험수익률 (한국은행 기준금리 2.5%)
  commission_pct: 0.015          # 위탁수수료 (%, MTS 기준)
  exchange_fee_pct: 0.0036396    # 유관기관제비용 (%)
  tax_kospi_pct: 0.20            # 코스피 실효 거래세 (%, 2026.1.1~)
  tax_kosdaq_pct: 0.20           # 코스닥 거래세 (%, 2026.1.1~)
  overseas_commission_pct: 0.025 # 해외주식 위탁수수료 (%)
  min_slippage_bps: 5.0          # 최소 슬리피지 (basis points, 편도)

# 백테스트 검증 게이트 (go/no-go 기준값)
validation:
  min_oos_trades: 30             # OOS 최소 거래수 (미달 시 강제 no-go)
  psr_min: 0.95                  # Probabilistic Sharpe Ratio 최솟값
  wfe_min: 0.50                  # Walk-Forward Efficiency 최솟값
  pbo_max: 0.50                  # Probability of Backtest Overfitting 최댓값
  dsr_min: 0.95                  # Deflated Sharpe Ratio 최솟값
  ror_max: 0.05                  # Probability of Ruin 최댓값 (5%)
  mc_ruin_threshold: 0.30        # 파산 기준 낙폭 (30%)
  mc_simulations: 1000           # 기본 MC 시뮬 횟수 (--full-validation 시 5000)
